name: Jarvis Backend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/toss-delta-final/jarvis-backend

jobs:
  # 1단계: 기능 테스트 (CI) — PR과 push 모두에서 실행
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle   # 의존성 캐시로 테스트 가속
      - name: Gradle 권한 부여
        run: chmod +x ./gradlew
      - name: 테스트 실행
        run: ./gradlew test

  # 2단계: 이미지 빌드 (CI) — EC2 대신 러너에서 빌드해 OOM 원천 차단
  build:
    needs: test   # 테스트 통과해야만 진행
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'   # PR에서는 빌드 생략
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR 푸시에 필요
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 자동 발급 토큰, 별도 등록 불필요
      # latest + 커밋 해시 태그 (해시 태그는 롤백 시 사용)
      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max   # 레이어 캐시로 빌드 가속

  # 3단계: 무중단 배포 (CD) — main 브랜치 전용
  #   대상그룹에서 뺀 뒤 교체하고, 정상 확인 후 다시 넣음
  #   배포 중인 서버는 대상그룹 밖이므로, 동시 배포 대수만큼 처리 능력이 빠진다
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read   # EC2에서 GHCR pull 시 필요
    strategy:
      # 4대 중 2대씩 교체 — 배포 중에도 항상 2대가 트래픽을 받는다(증설 전 상시 대수와 동일).
      # 2대 시절에는 1이었다. 한 대만 빼도 남는 게 한 대뿐이라 2 이상이면 전면 중단이었다.
      # 3 이상으로 올리면 살아남는 대수가 1대 이하가 되므로 올리지 말 것.
      max-parallel: 2
      fail-fast: true   # 앞 배치가 실패하면 뒤 배치는 시작하지 않음
      matrix:
        include:
          - host: EC2_HOST
            instance: i-07d7478729bc460da   # jarvis-backend-server
          - host: EC2_HOST_2
            instance: i-0605ad8b59fc4b03e   # jarvis-backend-server2
          - host: EC2_HOST_3
            instance: i-03f32c3c7a9145f64   # jarvis-backend-server3
          - host: EC2_HOST_4
            instance: i-00518087caef51eb8   # jarvis-backend-server4
    env:
      # 인스턴스를 재생성하면 ID가 바뀌므로 matrix 값도 함께 수정해야 함
      TG_ARN: arn:aws:elasticloadbalancing:ap-northeast-2:049705857330:targetgroup/jarvis-nginx-tg/d471e3090ff3c8b1
    steps:
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 이 서버로 오는 신규 요청을 끊고, 처리 중이던 요청이 끝날 때까지 대기
      # 등록 취소 지연 30초 설정에 따라 보통 30~60초 소요
      - name: 대상그룹에서 등록 취소
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn "$TG_ARN" \
            --targets Id=${{ matrix.instance }}
          aws elbv2 wait target-deregistered \
            --target-group-arn "$TG_ARN" \
            --targets Id=${{ matrix.instance }}

      # 이 시점부터 이 서버에는 트래픽이 없음 — 마음껏 죽였다 살려도 됨
      - name: EC2 배포 및 기동 검증
        uses: appleboy/ssh-action@v1.0.3   # 버전 고정 — @master는 예고 없이 깨짐
        with:
          host: ${{ secrets[matrix.host] }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 15m
          command_timeout: 15m
          script: |
            set -e   # 명령 하나라도 실패하면 뒤 단계 실행 안 함

            ENV_FILE=/home/ubuntu/jarvis-backend.env
            ENV_PREV=/home/ubuntu/jarvis-backend.env.prev
            LAST_GOOD=/home/ubuntu/jarvis-backend.last-good

            # 1. 롤백 대상 확보 — 교체 전에 현재 실행 중인 이미지를 기억
            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' jarvis-backend 2>/dev/null || true)

            # 2. 기존 컨테이너 유지한 채 새 이미지 먼저 받아 대기
            #    여기서 실패하면 아래로 진행하지 않으므로 서비스는 그대로 유지됨
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            # 3. env 파일 백업 후 새 시크릿 기록
            #    pull 성공 후에 수행 — pull 이 실패했을 때 기존 env 를 건드리지 않기 위함
            #    백업 이유: 실패 원인이 잘못된 시크릿 값일 수 있으므로
            #    이미지만 되돌리면 옛 이미지도 깨진 env 를 물려받아 똑같이 죽음
            #    APP_KAFKA_PREFIX는 미설정(=빈 값)이 정상이다 — 이 4대가 '접두어 없는 쪽'이고,
            #    같은 브로커를 공유하는 dev 서버만 dev- 로 갈라진다 (08 D10). 여기에 값을 넣으면
            #    운영이 새 토픽으로 옮겨가 기존 오프셋·보존 7일 데이터와 끊긴다.
            umask 077
            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" "$ENV_PREV"
            fi
            cat << 'ENVEOF' > "$ENV_FILE"
            DB_URL=${{ secrets.MARIADB_URL }}
            DB_USERNAME=${{ secrets.MARIADB_USERNAME }}
            DB_PASSWORD=${{ secrets.MARIADB_PASSWORD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=6379
            KAFKA_BOOTSTRAP_SERVERS=${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
            APP_KAFKA_PREFIX=${{ vars.APP_KAFKA_PREFIX }}
            APP_IMAGE_BASE_URL=${{ vars.APP_IMAGE_BASE_URL }}
            APP_CLIENT_IP_FORWARDED_DEPTH=${{ vars.APP_CLIENT_IP_FORWARDED_DEPTH }}
            APP_COOKIE_SECURE=true
            INTERNAL_API_TOKEN=${{ secrets.INTERNAL_API_TOKEN }}
            CUSTOMER_LABEL_SECRET=${{ secrets.CUSTOMER_LABEL_SECRET }}
            LLM_BASE_URL=${{ vars.FASTAPI_BASE_URL }}
            LLM_SSE_URL=${{ vars.FASTAPI_BASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            STREAM_TICKET_PRIVATE_KEY=${{ secrets.STREAM_TICKET_PRIVATE_KEY }}
            STREAM_TICKET_KID=${{ secrets.STREAM_TICKET_KID }}
            ENVEOF

            # 4. 교체 — host 네트워크 + 8080 단일 포트라 동시 실행 불가
            #    docker run 뒤의 || true 는 필수: 기동 명령 자체가 실패해도
            #    스크립트를 중단시키지 않고 아래 롤백 경로로 흘려보내기 위함
            docker stop jarvis-backend || true
            docker rm -f jarvis-backend || true
            docker run -d \
              --name jarvis-backend \
              --restart always \
              --network host \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --env-file "$ENV_FILE" \
              ${{ env.IMAGE }}:${{ github.sha }} || true

            # 5. 기동 확인 — 2초 간격 최대 60회(약 2분)
            OK=0
            for i in $(seq 1 60); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/liveness || true)
              if [ "$CODE" = "200" ]; then OK=1; break; fi
              sleep 2
            done

            # 6. 실패 시 롤백 — 이미지와 env 파일을 함께 되돌리고 복구 여부까지 검증
            if [ "$OK" != "1" ]; then
              docker logs --tail 100 jarvis-backend || true
              docker rm -f jarvis-backend || true

              ROLLBACK_IMAGE="$PREV_IMAGE"
              if [ -z "$ROLLBACK_IMAGE" ] && [ -f "$LAST_GOOD" ]; then
                ROLLBACK_IMAGE=$(cat "$LAST_GOOD")
              fi

              # 되돌릴 대상이 아예 없는 경우 — 수동 개입 필요
              if [ -z "$ROLLBACK_IMAGE" ]; then
                docker images ${{ env.IMAGE }} --format '{{.Tag}} {{.CreatedSince}}' | head -10
                exit 1
              fi

              if [ -f "$ENV_PREV" ]; then
                cp "$ENV_PREV" "$ENV_FILE"
              fi

              docker run -d \
                --name jarvis-backend \
                --restart always \
                --network host \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                --env-file "$ENV_FILE" \
                "$ROLLBACK_IMAGE" || true

              # 롤백이 실제로 살아났는지 검증 — 최대 90초
              RB=0
              for i in $(seq 1 45); do
                CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/liveness || true)
                if [ "$CODE" = "200" ]; then RB=1; break; fi
                sleep 2
              done

              # 롤백까지 실패한 경우에만 두 번째 로그 블록이 찍힘 — 즉시 수동 개입 신호
              if [ "$RB" != "1" ]; then
                docker ps -a --filter 'name=jarvis-backend' --format '{{.Names}} {{.Status}}'
                docker logs --tail 50 jarvis-backend || true
              fi
              exit 1
            fi

            # 7. 정상 기동 확인됨 — 이 이미지를 '마지막 정상'으로 기록
            docker inspect -f '{{.Config.Image}}' jarvis-backend > "$LAST_GOOD"

            # 8. 48시간 이상 지난 미사용 이미지 정리 (sha 태그 누적 방지)
            docker image prune -af --filter "until=48h"

      # 정상 기동이 확인된 뒤에만 트래픽을 다시 받기 시작
      # 정상 임계값 2 × 간격 10초 = 약 20~30초 소요
      - name: 대상그룹에 재등록
        run: |
          aws elbv2 register-targets \
            --target-group-arn "$TG_ARN" \
            --targets Id=${{ matrix.instance }}
          aws elbv2 wait target-in-service \
            --target-group-arn "$TG_ARN" \
            --targets Id=${{ matrix.instance }}

      # 배포 실패 또는 워크플로우 취소 시 인스턴스가 대상그룹 밖에 방치되는 것을 방지
      # 롤백으로 살아났으면 트래픽을 다시 받고, 죽어있으면 상태검사가 20초 내에 걸러냄
      - name: 실패·취소 시 재등록 보장
        if: failure() || cancelled()
        run: |
          aws elbv2 register-targets \
            --target-group-arn "$TG_ARN" \
            --targets Id=${{ matrix.instance }}

  # 4단계: dev 서버 배포 — dev 브랜치 전용
  #   1대뿐이라 대상그룹 조작을 하지 않는다(무중단이 성립하지 않음).
  #   운영과 공유하는 자원을 네 곳에서 분리한다:
  #     DB       jarvis_dev 스키마 (MARIADB_URL_DEV)
  #     커넥션 풀  2 — 운영 28(4대×7)에 더해도 RDS max_connections 30 안에 든다
  #     Redis    DB 인덱스 1 — 운영(0)의 캐시 키를 덮어쓰지 않는다
  #     Kafka    APP_KAFKA_PREFIX=dev- — 같은 브로커를 쓰되 토픽·컨슈머 그룹이 갈라진다 (08 D10)
  #   커넥션 풀과 Redis 인덱스는 application.yml을 고치지 않고
  #   Spring relaxed binding으로 환경변수에서 덮어쓴다.
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: dev 백엔드 배포 및 기동 검증
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 15m
          command_timeout: 15m
          script: |
            set -e

            ENV_FILE=/home/ubuntu/jarvis-backend.env
            ENV_PREV=/home/ubuntu/jarvis-backend.env.prev
            LAST_GOOD=/home/ubuntu/jarvis-backend.last-good

            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' jarvis-backend 2>/dev/null || true)

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            umask 077
            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" "$ENV_PREV"
            fi
            cat << 'ENVEOF' > "$ENV_FILE"
            DB_URL=${{ secrets.MARIADB_URL_DEV }}
            DB_USERNAME=${{ secrets.MARIADB_USERNAME }}
            DB_PASSWORD=${{ secrets.MARIADB_PASSWORD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=6379
            SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=2
            SPRING_DATA_REDIS_DATABASE=1
            KAFKA_BOOTSTRAP_SERVERS=${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
            APP_KAFKA_PREFIX=dev-
            APP_IMAGE_BASE_URL=${{ vars.APP_IMAGE_BASE_URL }}
            APP_CLIENT_IP_FORWARDED_DEPTH=${{ vars.APP_CLIENT_IP_FORWARDED_DEPTH }}
            APP_COOKIE_SECURE=true
            INTERNAL_API_TOKEN=${{ secrets.INTERNAL_API_TOKEN }}
            CUSTOMER_LABEL_SECRET=${{ secrets.CUSTOMER_LABEL_SECRET }}
            LLM_BASE_URL=https://dev-ai.narvis.shop
            LLM_SSE_URL=https://dev-ai.narvis.shop
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            STREAM_TICKET_PRIVATE_KEY=${{ secrets.STREAM_TICKET_PRIVATE_KEY }}
            STREAM_TICKET_KID=${{ secrets.STREAM_TICKET_KID }}
            ENVEOF

            docker stop jarvis-backend || true
            docker rm -f jarvis-backend || true
            docker run -d \
              --name jarvis-backend \
              --restart always \
              --network host \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --env-file "$ENV_FILE" \
              ${{ env.IMAGE }}:${{ github.sha }} || true

            OK=0
            for i in $(seq 1 60); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/liveness || true)
              if [ "$CODE" = "200" ]; then OK=1; break; fi
              sleep 2
            done

            if [ "$OK" != "1" ]; then
              docker logs --tail 100 jarvis-backend || true
              docker rm -f jarvis-backend || true

              ROLLBACK_IMAGE="$PREV_IMAGE"
              if [ -z "$ROLLBACK_IMAGE" ] && [ -f "$LAST_GOOD" ]; then
                ROLLBACK_IMAGE=$(cat "$LAST_GOOD")
              fi
              if [ -z "$ROLLBACK_IMAGE" ]; then
                docker images ${{ env.IMAGE }} --format '{{.Tag}} {{.CreatedSince}}' | head -10
                exit 1
              fi

              if [ -f "$ENV_PREV" ]; then
                cp "$ENV_PREV" "$ENV_FILE"
              fi

              docker run -d \
                --name jarvis-backend \
                --restart always \
                --network host \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                --env-file "$ENV_FILE" \
                "$ROLLBACK_IMAGE" || true
              exit 1
            fi

            # 기동 후 접두어가 실제로 붙었는지 로그로 확인 (08 D10)
            docker logs jarvis-backend 2>&1 | grep -i 'topic=' | head -5 || true

            docker inspect -f '{{.Config.Image}}' jarvis-backend > "$LAST_GOOD"
            docker image prune -af --filter "until=48h"
