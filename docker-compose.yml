# 로컬 개발용 (03 §4 — MariaDB 11.x + Redis). 배포는 배포 담당 소관(RDS 외부화, 03 §1-2).
# 기본값은 로컬 전용 더미 — 실제 값 오버라이드는 .env (.env.example 참조)
services:
  mariadb:
    image: mariadb:11.4
    container_name: jarvis-mariadb
    ports:
      # 로컬에 다른 MySQL/MariaDB가 3306을 점유 중이면 .env에서 DB_PORT만 바꾼다
      - "${DB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-local}
      MARIADB_DATABASE: ${DB_NAME:-jarvis}
      MARIADB_USER: ${DB_USERNAME:-jarvis}
      MARIADB_PASSWORD: ${DB_PASSWORD:-jarvis-local}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 행동 이벤트 스트림 브로커 (08 D6) — KRaft 단일 노드. 운영은 전용 EC2(jarvis-kafka)라
  # 이 정의는 로컬 전용이지만 설정값은 운영과 같게 둔다(보존 7일 등).
  kafka:
    image: apache/kafka:3.9.0
    container_name: jarvis-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 호스트는 비워 전 인터페이스 바인딩. 0.0.0.0을 쓰면 컴바인드 모드에서 CONTROLLER의
      # 광고 주소가 여기서 파생돼 "advertised.listeners cannot use 0.0.0.0"으로 기동 실패한다
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 클라이언트가 접속할 주소. 로컬은 호스트에서 도는 Spring이라 localhost,
      # 운영(jarvis-kafka EC2)은 KAFKA_ADVERTISED_HOST=172.31.46.48로 덮는다 (08 D6)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:9092,CONTROLLER://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 단일 노드라 복제본을 둘 곳이 없다 — 기본값 3이면 내부 토픽 생성부터 실패한다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 보존 7일 (08 D6) — 시연 시점에 리허설 구간까지 되감을 수 있게
      KAFKA_LOG_RETENTION_HOURS: 168
      # 컨슈머 그룹 최초 조인 지연(기본 3초) 제거 — 로컬 기동 체감용
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mariadb-data:
  kafka-data:
